# Shared proxy settings for every location nginx passes to the app. Installed by deploy.sh as
# /etc/nginx/snippets/kitaphana-proxy.conf.
proxy_pass http://127.0.0.1:8000;
proxy_set_header Host $host;
# uvicorn reads the client address from here (it trusts 127.0.0.1). Without it every reader looks
# like 127.0.0.1 and the per-address login limit locks everyone out at once (Sprint 03).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# If the app is down, fail fast with nginx's 502 page instead of hanging.
proxy_connect_timeout 5s;
