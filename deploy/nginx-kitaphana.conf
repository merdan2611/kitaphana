# nginx site for kitaphana.men. Installed by deploy.sh as /etc/nginx/sites-available/kitaphana
# and linked into sites-enabled — edit it here, not on the server. Check with `nginx -t`.
#
# The certificate comes from `certbot certonly --nginx` (Sprint 02 notes), which leaves this
# file alone; renewal runs from certbot's systemd timer.

# --- Flood protection -------------------------------------------------------------------------
# Per-address limits. Many readers in Turkmenistan share one public address behind their mobile
# operator, so these are sized for a crowd behind one address, not for one person: they stop a
# single machine hammering the site, not a busy office. The app keeps its own, much stricter,
# limits on login codes, downloads and requests.
limit_req_zone  $binary_remote_addr zone=kp_pages:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=kp_login:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=kp_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Anything asking for the bare IP address or an unknown host name — scanners, mostly — gets the
# connection closed with no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}

# Plain HTTP: only certificate renewal and a redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name kitaphana.men www.kitaphana.men;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://kitaphana.men$request_uri; }
}

# www -> the bare domain.
server {
    listen 443 ssl http2;       # "http2 on;" needs nginx 1.25.1; Ubuntu 24.04 has 1.24
    listen [::]:443 ssl http2;
    server_name www.kitaphana.men;

    ssl_certificate     /etc/letsencrypt/live/kitaphana.men/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitaphana.men/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://kitaphana.men$request_uri;
}

server {
    listen 443 ssl http2;       # "http2 on;" needs nginx 1.25.1; Ubuntu 24.04 has 1.24
    listen [::]:443 ssl http2;
    server_name kitaphana.men;

    ssl_certificate     /etc/letsencrypt/live/kitaphana.men/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitaphana.men/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Pre-launch gate: the whole site asks for a password until testing is over, because with
    # login codes on screen (ADR-0013) anyone who found it could sign in. Make the file with
    # `htpasswd` (Sprint 02 notes). To launch, delete these three lines and the /health block.
    auth_basic           "Kitaphana (testing)";
    auth_basic_user_file /etc/nginx/kitaphana.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Slow-connection attacks: drop clients that open a request and then trickle it in.
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          60s;
    keepalive_timeout     30s;
    # Only admin book uploads are large; everywhere else a request body is a small form.
    client_max_body_size  1m;
    limit_conn kp_conn 60;

    # A catalogue page is 18 KB of HTML but 3.4 KB gzipped (measured in Sprint 05).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/kitaphana.access.log;
    error_log  /var/log/nginx/kitaphana.error.log;

    # Static assets straight from disk. Links carry ?v=<hash>, so they can be cached long.
    location /static/ {
        alias /srv/kitaphana/static/;
        expires 30d;
        access_log off;
    }

    # Cover JPEGs straight from disk; the app's /covers/ route is only the local-dev fallback.
    # Quoted: nginx reads bare {braces} in a regex as a block.
    location ~ "^/covers/[0-9a-f]{2}/[0-9a-f]{64}\.jpg$" {
        root /var/lib/kitaphana/media;
        expires 1y;
        access_log off;
    }

    # Book PDFs (ADR-0014). Reachable only through the app's X-Accel-Redirect, never by URL;
    # ACCEL_PREFIX in app/downloads.py must match. Trailing slashes on both, or paths join wrongly.
    location /_protected/ {
        internal;
        alias /var/lib/kitaphana/media/;
    }

    # Login: a code request costs an SMS in Phase 2, so the edge limit is much tighter here.
    location /login {
        limit_req zone=kp_login burst=10 nodelay;
        include snippets/kitaphana-proxy.conf;
    }

    # Admin uploads: a little above MAX_UPLOAD_MB (200), or nginx refuses big PDFs first.
    location /admin/ {
        client_max_body_size 210m;
        client_body_timeout  120s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        include snippets/kitaphana-proxy.conf;
    }

    # Outside the pre-launch gate, so the deploy can be checked with plain curl.
    location = /health {
        auth_basic off;
        limit_req zone=kp_pages burst=40 nodelay;
        include snippets/kitaphana-proxy.conf;
    }

    location / {
        limit_req zone=kp_pages burst=40 nodelay;
        include snippets/kitaphana-proxy.conf;
    }
}
