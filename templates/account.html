{% extends "base.html" %}

{% block title %}Hasabym: Kitaphana{% endblock %}
{% block body_class %}page-desk{% endblock %}

{% block content %}
<div class="account-layout">
    <h1>Hasabym</h1>
    <section class="card account-card">
        <dl class="account-details">
            <div>
                <dt>Telefon belgisi</dt>
                <dd>{{ user.phone | phone }}</dd>
            </div>
            <div>
                <dt>Ýyldyz balansy</dt>
                <dd class="placeholder">ýakyn wagtda</dd>
            </div>
        </dl>
    </section>
    <form method="post" action="/logout" class="account-logout">
        <button class="button-quiet" type="submit">Çykyş</button>
    </form>
</div>
{% endblock %}
