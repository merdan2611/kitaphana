{% extends "base.html" %}

{% block head %}<link rel="stylesheet" href="{{ url_for('static', path='admin.css') }}">{% endblock %}
{% block body_class %}admin{% endblock %}
{% block main_class %}admin-content{% endblock %}

{% block header %}
<header class="admin-bar">
    <div class="admin-bar-inner">
        <a class="admin-brand" href="/admin">Kitaphana <span>dolandyryş</span></a>
        <nav class="admin-nav" aria-label="Dolandyryş">
            <a href="/admin" {% if section == "index" %}aria-current="page"{% endif %}>Umumy</a>
            <a href="/admin/books" {% if section == "books" %}aria-current="page"{% endif %}>Kitaplar</a>
            <a href="/admin/books/new" {% if section == "new" %}aria-current="page"{% endif %}>Kitap goş</a>
        </nav>
        <a class="admin-exit" href="/">Saýta dolan</a>
    </div>
</header>
{% endblock %}

{% block footer %}{% endblock %}
